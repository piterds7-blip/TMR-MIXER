name: Deploy TMR Mixer to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: fermapps-tmrmixer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zapisz klucz konta serwisowego
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Brak sekretu FIREBASE_SERVICE_ACCOUNT w ustawieniach repozytorium." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Najpierw baza (reguły + moduły). Jeśli Firestore nie jest jeszcze utworzony, workflow zatrzyma się tutaj
      # i strona zostanie w poprzedniej wersji — nic się nie zepsuje.
      - name: Wdróż reguły Firestore
        run: npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Wgraj chronione moduły do Firestore
        run: |
          npm install --no-save --no-package-lock firebase-admin@12.7.0
          node tools/upload-modules.js

      - name: Utwórz witrynę hostingową (jeśli nie istnieje)
        run: |
          npx --yes firebase-tools@13.29.1 hosting:sites:create fermapps-tmrmixer --project "$FIREBASE_PROJECT_ID" --non-interactive || echo "Witryna już istnieje — pomijam."

      - name: Wdróż na Firebase Hosting
        run: |
          rm -rf node_modules
          npx --yes firebase-tools@13.29.1 deploy --only hosting:fermapps-tmrmixer --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Usuń klucz z maszyny
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
